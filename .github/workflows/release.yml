# 发布流水线：父仓库打 v* tag 触发，构建双平台镜像推 GHCR 并创建 GitHub Release。
#
# 发布流程（人做的部分）：
#   1. 两个子仓库各自打 tag 并 push（版本号互不相干）
#   2. 父仓库确认 submodule 指针指向已打 tag 的 commit，push
#   3. 父仓库打 v* tag push → 本 workflow 全自动
# 门禁：子模块引用的 commit 缺 tag 时 CI 失败；在子仓库补 tag（不改变 commit）后
# 直接 re-run workflow 即可，父仓库 tag 不用删。
#
# 双平台构建：不用 QEMU（Bun 在 QEMU 模拟下不稳定），linux/amd64 与 linux/arm64
# 各跑在 GitHub 原生 runner 上（public 仓库免费的 ubuntu-24.04-arm）并行构建，
# 单架构镜像按 digest 推送，最后由 merge job 合并成多平台 manifest 再打 tag。
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # 创建 GitHub Release
  packages: write # 推送 GHCR 镜像

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      # fetch-depth: 0 拉全量父仓库历史：生成 notes 时要 ls-tree 上一个父 tag
      # 里子模块指向的 commit。父仓库 tags 随全量 fetch 一起到位。
      # .gitmodules 是相对路径，checkout 自动按父仓库的 https URL 解析子模块，
      # public 仓库匿名可拉，无需额外凭据。
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0

      # checkout 对 submodule 是浅克隆且不带 tags；门禁检查与版本注入
      # 都依赖子仓库 tag，手动补拉（tag 可达的旧 commit 对象会一并取回）。
      - name: Fetch submodule tags
        run: |
          git -C kiku-frontend fetch origin --tags --force
          git -C kiku-backend fetch origin --tags --force

      # 门禁：子模块当前引用的 commit 必须在各自仓库有 tag（保证可追溯）。
      # 版本号不要求一致，只要求「打过 tag」。两个矩阵 job 重复执行，幂等。
      - name: Check submodule tags
        run: |
          fail=0
          for sub in kiku-frontend kiku-backend; do
            if [ -z "$(git -C "$sub" tag --points-at HEAD)" ]; then
              echo "::error::$sub points to commit $(git -C "$sub" rev-parse --short HEAD) which has no tag. Tag it in the submodule repo, push, then re-run this workflow"
              fail=1
            fi
          done
          exit "$fail"

      # 前后端版本号自动取各自子模块当前引用 commit 上的 tag（上方门禁保证非空；
      # 一个 commit 多个 tag 时取第一个），互不相干；commit 取各自 HEAD 短 hash。
      # 镜像版本只由父仓库 tag 决定，发布时无需人工填任何版本号。
      - name: Collect build args
        id: args
        run: |
          {
            echo "frontend_version=$(git -C kiku-frontend tag --points-at HEAD | head -1)"
            echo "backend_version=$(git -C kiku-backend tag --points-at HEAD | head -1)"
            echo "frontend_commit=$(git -C kiku-frontend rev-parse --short HEAD)"
            echo "backend_commit=$(git -C kiku-backend rev-parse --short HEAD)"
          } >> "$GITHUB_OUTPUT"

      # 创建 docker-container driver 的 builder：runner 默认的 docker driver
      # 不支持 push-by-digest 输出（下方单架构镜像按 digest 推送依赖它）。
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Dockerfile 在父仓库根，build context 是父仓库（COPY 两个子模块目录），
      # 四个版本 ARG 已在 Dockerfile/compose.yml 定义，这里只填值。
      # push-by-digest：单架构镜像先按 digest 推上去、不打任何 tag，
      # 由 merge job 合并成多平台 manifest 后统一打 <tag> / latest。
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/sion10032/kiku,push-by-digest=true,name-canonical=true,push=true
          build-args: |
            APP_VERSION_FRONTEND=${{ steps.args.outputs.frontend_version }}
            APP_VERSION_BACKEND=${{ steps.args.outputs.backend_version }}
            GIT_COMMIT_FRONTEND=${{ steps.args.outputs.frontend_commit }}
            GIT_COMMIT_BACKEND=${{ steps.args.outputs.backend_commit }}

      # digest 存为 artifact，文件名取 sha256: 之后的 hex（merge job 按文件名拼源引用）
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.runner }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # 把两个单架构镜像合成一个多平台 manifest，一次性打 <tag> + latest：
  # tag 出现即代表双平台齐全，不存在「latest 暂时只有单平台」的中间态。
  # 结果同时推 GHCR 与 Docker Hub：单架构镜像只推在 GHCR（build job 唯一推送目标），
  # imagetools create 支持跨 registry 复制（拉源 manifest → 推到目标）。
  # 两个 registry 各一条命令互不牵连，一边失败另一边照常；re-run 时源 digest 不变，幂等。
  merge:
    runs-on: ubuntu-latest
    needs: build
    env:
      # secrets 只能在 job 级 env 引用（workflow 顶层 env 不支持 secrets 上下文）
      DH_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/kiku
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      # README 同步需要仓库里的 README.md：浅克隆即可（无子模块/全量历史）
      - uses: actions/checkout@v7

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push multi-arch manifests
        # 必须在 digest 目录里执行：源引用按文件名拼 @sha256:<hex>；若用完整路径展开，
        # /tmp/digests/ 前缀会被拼进 digest，报 invalid reference format。
        working-directory: /tmp/digests
        run: |
          # $(printf ...) 的分词是刻意的：digest 文件名（当前目录）逐个展开成源镜像引用
          # （指令放脚本顶部，对整个脚本生效）
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            -t "ghcr.io/sion10032/kiku:${GITHUB_REF_NAME}" \
            -t "ghcr.io/sion10032/kiku:latest" \
            $(printf 'ghcr.io/sion10032/kiku@sha256:%s ' *)
          # 同样刻意的分词
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            -t "docker.io/${DH_IMAGE}:${GITHUB_REF_NAME}" \
            -t "docker.io/${DH_IMAGE}:latest" \
            $(printf 'ghcr.io/sion10032/kiku@sha256:%s ' *)
          docker buildx imagetools inspect "ghcr.io/sion10032/kiku:${GITHUB_REF_NAME}"
          docker buildx imagetools inspect "docker.io/${DH_IMAGE}:${GITHUB_REF_NAME}"

      # manifest 打完 tag 后把 README 同步为 Docker Hub 镜像描述（英文版），
      # 与镜像发布同生命周期、幂等；凭据与镜像推送共用，失败即红可 re-run。
      # GHCR 无需此步：GitHub Packages 页面自动显示源仓库 README。
      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DH_IMAGE }}
          readme-filepath: ./README.md
          short-description: Self-hosted media server for DLsite voice works

  release:
    runs-on: ubuntu-latest
    needs: merge
    steps:
      # notes 生成需要父仓库历史（找上一个 tag）与子模块 tag，重新 checkout
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0

      - name: Fetch submodule tags
        run: |
          git -C kiku-frontend fetch origin --tags --force
          git -C kiku-backend fetch origin --tags --force

      # Release notes 不汇总父仓库 commit（都是 update submodules，无信息量），
      # 改为列出两个子模块 tag 的变化；变更明细不复制 commit，直接给子仓库
      # 的 GitHub compare 链接（public，点开即完整列表）。
      # 旧 commit 恰好无 tag（历史遗留）时降级显示短 hash，compare 照样能点。
      - name: Build release notes
        run: |
          # 上一个 v* tag：当前触发的 tag 也在本地，按版本倒序取第二个（首个发布为空）
          prev=$(git tag --sort=-v:refname | grep -E '^v' | sed -n '2p')
          line() { # $1=label $2=submodule dir $3=GitHub repo name
            cur=$(git -C "$2" tag --points-at HEAD | head -1)
            if [ -z "$prev" ]; then
              echo "- $1 — -> $cur"
            else
              old_sha=$(git ls-tree "$prev" "$2" | awk '{print $3}')
              old=$(git -C "$2" tag --points-at "$old_sha" | head -1)
              if [ -z "$old" ]; then old="${old_sha:0:7}"; fi
              echo "- $1 $old -> $cur ([changes](https://github.com/Sion10032/$3/compare/$old...$cur))"
            fi
          }
          {
            line Frontend kiku-frontend kiku-frontend
            line Backend kiku-backend kiku-backend
            echo
            echo "Image: \`ghcr.io/sion10032/kiku:${GITHUB_REF_NAME}\` (also pushed as \`latest\`, linux/amd64 + linux/arm64)"
          } > body.md
          cat body.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: body.md
