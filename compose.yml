services:
  kiku:
    image: ghcr.io/sion10032/kiku:latest
    build:
      context: .
      # 两端版本显示都靠构建期注入（不做 git 解析）；不传则显示 dev-unknown
      args:
        APP_VERSION_FRONTEND: ${APP_VERSION_FRONTEND:-}
        APP_VERSION_BACKEND: ${APP_VERSION_BACKEND:-}
        GIT_COMMIT_FRONTEND: ${GIT_COMMIT_FRONTEND:-}
        GIT_COMMIT_BACKEND: ${GIT_COMMIT_BACKEND:-}
    restart: always
    ports:
      - "8888:8888"
    environment:
      HOST: 0.0.0.0
      PORT: 8888
      # 数据目录属主：设成宿主机运行用户的 uid/gid（也可写进同级 .env）
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    volumes:
      # config.json + sqlite（容器内以 uid 1000 运行，宿主机目录需对 1000 可写）
      - ./data:/app/data
      # 媒体库：宿主机目录用 MEDIA_DIR 指定，容器内固定只读挂到 /media
      - ${MEDIA_DIR:-./media}:/media:ro
